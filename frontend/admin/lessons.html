<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EZLearn — Manage Lessons</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="css/admin.css" />
</head>
<body>

    <div class="toast-container" id="toastContainer"></div>

    <aside class="sidebar">
        <div class="sidebar__logo">
            <svg width="32" height="32" viewBox="0 0 40 40" fill="none">
                <rect x="3" y="3" width="34" height="34" rx="8" stroke="#8B5CF6" stroke-width="2.5"/>
                <path d="M20 11L20 29M11 20L29 20" stroke="#8B5CF6" stroke-width="2.5" stroke-linecap="round"/>
                <circle cx="20" cy="20" r="4" stroke="#06B6D4" stroke-width="2"/>
                <circle cx="20" cy="20" r="2" fill="#06B6D4"/>
            </svg>
            <span class="sidebar__logo-text">EZLearn</span>
        </div>
        <nav class="sidebar__nav">
            <a href="index.html" class="sidebar__link"><i class="fas fa-chart-pie"></i><span>Dashboard</span></a>
            <a href="courses.html" class="sidebar__link"><i class="fas fa-book-open"></i><span>Courses</span></a>
            <a href="topics.html" class="sidebar__link"><i class="fas fa-list"></i><span>Topics</span></a>
            <a href="lessons.html" class="sidebar__link sidebar__link--active"><i class="fas fa-file-alt"></i><span>Lessons</span></a>
            <a href="users.html" class="sidebar__link"><i class="fas fa-users"></i><span>Users</span></a>
            <a href="feedbacks.html" class="sidebar__link"><i class="fas fa-comment-dots"></i><span>Feedbacks</span></a>
        </nav>
        <div class="sidebar__footer">
            <a href="../index.html" class="sidebar__link"><i class="fas fa-arrow-left"></i><span>Back to Site</span></a>
            <a href="#" class="sidebar__link" id="logoutBtn"><i class="fas fa-sign-out-alt"></i><span>Logout</span></a>
        </div>
    </aside>

    <main class="main">

        <div class="page-header">
            <div class="page-header__left">
                <h1>📝 Lessons</h1>
                <p>Manage all lessons across topics</p>
            </div>
            <div class="page-header__right">
                <button class="btn btn--primary" onclick="openModal('lessonModal')">
                    <i class="fas fa-plus"></i> Add Lesson
                </button>
            </div>
        </div>

        <div class="card">
            <div class="card__header">
                <span class="card__title">📋 All Lessons</span>
            </div>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr><th>#</th><th>Title</th><th>Topic</th><th>Course</th><th>Actions</th></tr>
                    </thead>
                    <tbody id="lessonsTable">
                        <tr><td colspan="5"><div class="empty"><i class="fas fa-file-alt"></i><h3>No lessons yet</h3><p>Create your first lesson</p></div></td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <!-- ===== MODAL: Add/Edit Lesson ===== -->
    <div class="modal-overlay" id="lessonModal">
        <div class="modal">
            <div class="modal__header">
                <span class="modal__title" id="lessonModalTitle">➕ Add New Lesson</span>
                <span class="modal__close" onclick="closeModal('lessonModal')">&times;</span>
            </div>
            <form id="lessonForm">
                <input type="hidden" id="lessonId" value="" />
                <div class="form-group">
                    <label>Title <span class="required">*</span></label>
                    <input type="text" id="lessonTitle" class="form-control" placeholder="e.g., What are Hooks?" required />
                </div>
                <div class="form-group">
                    <label>Content <span class="required">*</span></label>
                    <textarea id="lessonContent" class="form-control" rows="4" placeholder="Write the lesson content..." required></textarea>
                </div>
                <div class="form-group">
                    <label>Topic <span class="required">*</span></label>
                    <select id="lessonTopic" class="form-control" required></select>
                </div>
                <div class="form-group">
                    <label>Video URL</label>
                    <input type="text" id="lessonVideo" class="form-control" placeholder="https://youtube.com/example" />
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn--primary btn--full" id="lessonSubmitBtn">
                        <i class="fas fa-save"></i> Save Lesson
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script type="module">
        import { showToast, showError, showLoading, hideLoading, openModal, closeModal } from '../components/ui.js';
        import { getLessons, createLesson, updateLesson, deleteLesson } from '../js/services/lessonService.js';
        import { getTopics } from '../js/services/topicService.js';
        import { getCourses } from '../js/services/courseService.js';

        if (!sessionStorage.getItem('token')) window.location.href = '../login.html';

        document.getElementById('logoutBtn').addEventListener('click', () => {
            if (confirm('Logout?')) {
                sessionStorage.removeItem('token');
                sessionStorage.removeItem('user');
                window.location.href = '../login.html';
            }
        });

        async function loadTopicsDropdown() {
            try {
                const res = await getTopics();
                const select = document.getElementById('lessonTopic');
                select.innerHTML = res.data.map(t => `<option value="${t.id}">${t.title}</option>`).join('');
            } catch (error) {
                showError('Failed to load topics');
            }
        }

        async function loadLessons() {
            try {
                const [lessonsRes, topicsRes, coursesRes] = await Promise.all([
                    getLessons(),
                    getTopics().catch(() => ({ data: [] })),
                    getCourses().catch(() => ({ data: [] }))
                ]);

                const lessons = lessonsRes.data || [];
                const topics = topicsRes.data || [];
                const courses = coursesRes.data || [];

                const tbody = document.getElementById('lessonsTable');

                if (lessons.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="5"><div class="empty"><i class="fas fa-file-alt"></i><h3>No lessons yet</h3><p>Create your first lesson</p></div></td></tr>`;
                    return;
                }

                tbody.innerHTML = lessons.map((lesson, index) => {
                    const topic = topics.find(t => t.id === lesson.topicId);
                    const course = courses.find(c => c.id === topic?.courseId);
                    return `
                        <tr>
                            <td>${index + 1}</td>
                            <td><strong>${lesson.title}</strong></td>
                            <td>${topic?.title || 'Unknown'}</td>
                            <td>${course?.title || 'Unknown'}</td>
                            <td>
                                <button class="btn btn--warning btn--sm" onclick="editLesson(${lesson.id})">
                                    <i class="fas fa-edit"></i>
                                </button>
                                <button class="btn btn--danger btn--sm" onclick="deleteLessonHandler(${lesson.id})">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </td>
                        </tr>
                    `;
                }).join('');

            } catch (error) {
                showError('Failed to load lessons: ' + error.message);
            }
        }

        window.editLesson = async function(id) {
            try {
                const res = await getLessons();
                const lesson = res.data.find(l => l.id === id);
                if (!lesson) return;

                await loadTopicsDropdown();
                document.getElementById('lessonId').value = lesson.id;
                document.getElementById('lessonTitle').value = lesson.title;
                document.getElementById('lessonContent').value = lesson.content || '';
                document.getElementById('lessonTopic').value = lesson.topicId;
                document.getElementById('lessonVideo').value = lesson.videoUrl || '';
                document.getElementById('lessonModalTitle').textContent = '✏️ Edit Lesson';
                document.getElementById('lessonSubmitBtn').innerHTML = '<i class="fas fa-save"></i> Update Lesson';
                openModal('lessonModal');
            } catch (error) {
                showError('Failed to load lesson details');
            }
        };

        window.deleteLessonHandler = async function(id) {
            if (!confirm('Delete this lesson?')) return;
            try {
                await deleteLesson(id);
                showToast('success', 'Deleted', 'Lesson deleted successfully');
                loadLessons();
            } catch (error) {
                showError('Failed to delete lesson: ' + error.message);
            }
        };

        document.getElementById('lessonForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const id = document.getElementById('lessonId').value;
            const title = document.getElementById('lessonTitle').value.trim();
            const content = document.getElementById('lessonContent').value.trim();
            const topicId = Number(document.getElementById('lessonTopic').value);
            const videoUrl = document.getElementById('lessonVideo').value.trim();

            if (!title || !content || !topicId) {
                showError('Please fill in all required fields.');
                return;
            }

            showLoading('lessonSubmitBtn');

            try {
                if (id) {
                    await updateLesson(id, { title, content, topicId, videoUrl });
                    showToast('success', 'Updated', 'Lesson updated successfully');
                } else {
                    await createLesson({ title, content, topicId, videoUrl });
                    showToast('success', 'Created', 'Lesson created successfully');
                }

                closeModal('lessonModal');
                this.reset();
                document.getElementById('lessonId').value = '';
                document.getElementById('lessonModalTitle').textContent = '➕ Add New Lesson';
                document.getElementById('lessonSubmitBtn').innerHTML = '<i class="fas fa-save"></i> Save Lesson';
                loadLessons();
            } catch (error) {
                showError('Failed to save lesson: ' + error.message);
            } finally {
                hideLoading('lessonSubmitBtn');
            }
        });

        document.querySelector('#lessonModal .modal__close').addEventListener('click', function() {
            document.getElementById('lessonForm').reset();
            document.getElementById('lessonId').value = '';
            document.getElementById('lessonModalTitle').textContent = '➕ Add New Lesson';
            document.getElementById('lessonSubmitBtn').innerHTML = '<i class="fas fa-save"></i> Save Lesson';
            closeModal('lessonModal');
        });

        await loadTopicsDropdown();
        await loadLessons();

        document.querySelectorAll('.sidebar__link').forEach(link => {
            if (link.getAttribute('href') === 'lessons.html') {
                link.classList.add('sidebar__link--active');
            }
        });

        window.openModal = openModal;
        window.closeModal = closeModal;
    </script>

</body>
</html>
