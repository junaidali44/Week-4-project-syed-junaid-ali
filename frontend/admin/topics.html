<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EZLearn — Manage Topics</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="css/admin.css" />
</head>
<body>

    <div class="toast-container" id="toastContainer"></div>

    <aside class="sidebar">
        <div class="sidebar__logo">
            <svg width="32" height="32" viewBox="0 0 40 40" fill="none">
                <rect x="3" y="3" width="34" height="34" rx="8" stroke="#8B5CF6" stroke-width="2.5"/>
                <path d="M20 11L20 29M11 20L29 20" stroke="#8B5CF6" stroke-width="2.5" stroke-linecap="round"/>
                <circle cx="20" cy="20" r="4" stroke="#06B6D4" stroke-width="2"/>
                <circle cx="20" cy="20" r="2" fill="#06B6D4"/>
            </svg>
            <span class="sidebar__logo-text">EZLearn</span>
        </div>
        <nav class="sidebar__nav">
            <a href="index.html" class="sidebar__link"><i class="fas fa-chart-pie"></i><span>Dashboard</span></a>
            <a href="courses.html" class="sidebar__link"><i class="fas fa-book-open"></i><span>Courses</span></a>
            <a href="topics.html" class="sidebar__link sidebar__link--active"><i class="fas fa-list"></i><span>Topics</span></a>
            <a href="lessons.html" class="sidebar__link"><i class="fas fa-file-alt"></i><span>Lessons</span></a>
            <a href="users.html" class="sidebar__link"><i class="fas fa-users"></i><span>Users</span></a>
            <a href="feedbacks.html" class="sidebar__link"><i class="fas fa-comment-dots"></i><span>Feedbacks</span></a>
        </nav>
        <div class="sidebar__footer">
            <a href="../index.html" class="sidebar__link"><i class="fas fa-arrow-left"></i><span>Back to Site</span></a>
            <a href="#" class="sidebar__link" id="logoutBtn"><i class="fas fa-sign-out-alt"></i><span>Logout</span></a>
        </div>
    </aside>

    <main class="main">

        <div class="page-header">
            <div class="page-header__left">
                <h1>📂 Topics</h1>
                <p>Manage all topics across courses</p>
            </div>
            <div class="page-header__right">
                <button class="btn btn--primary" onclick="openModal('topicModal')">
                    <i class="fas fa-plus"></i> Add Topic
                </button>
            </div>
        </div>

        <div class="card">
            <div class="card__header">
                <span class="card__title">📋 All Topics</span>
            </div>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr><th>#</th><th>Title</th><th>Course</th><th>Lessons</th><th>Actions</th></tr>
                    </thead>
                    <tbody id="topicsTable">
                        <tr><td colspan="5"><div class="empty"><i class="fas fa-list"></i><h3>No topics yet</h3><p>Create your first topic</p></div></td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <!-- ===== MODAL: Add/Edit Topic ===== -->
    <div class="modal-overlay" id="topicModal">
        <div class="modal">
            <div class="modal__header">
                <span class="modal__title" id="topicModalTitle">➕ Add New Topic</span>
                <span class="modal__close" onclick="closeModal('topicModal')">&times;</span>
            </div>
            <form id="topicForm">
                <input type="hidden" id="topicId" value="" />
                <div class="form-group">
                    <label>Title <span class="required">*</span></label>
                    <input type="text" id="topicTitle" class="form-control" placeholder="e.g., React Hooks" required />
                </div>
                <div class="form-group">
                    <label>Course <span class="required">*</span></label>
                    <select id="topicCourse" class="form-control" required></select>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn--primary btn--full" id="topicSubmitBtn">
                        <i class="fas fa-save"></i> Save Topic
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script type="module">
        import { showToast, showError, showLoading, hideLoading, openModal, closeModal } from '../js/components/ui.mjs';
        import { getTopics, createTopic, updateTopic, deleteTopic } from '../js/services/topicService.js';
        import { getCourses } from '../js/services/courseService.js';
        import { getLessons } from '../js/services/lessonsService.js';

        if (!sessionStorage.getItem('token')) window.location.href = '../login.html';

        document.getElementById('logoutBtn').addEventListener('click', () => {
            if (confirm('Logout?')) {
                sessionStorage.removeItem('token');
                sessionStorage.removeItem('user');
                window.location.href = '../login.html';
            }
        });

        async function loadCoursesDropdown() {
            try {
                const res = await getCourses();
                const select = document.getElementById('topicCourse');
                select.innerHTML = res.data.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
            } catch (error) {
                showError('Failed to load courses');
            }
        }

        async function loadTopics() {
            try {
                const [topicsRes, lessonsRes] = await Promise.all([
                    getTopics(),
                    getLessons().catch(() => ({ data: [] }))
                ]);

                const topics = topicsRes.data || [];
                const lessons = lessonsRes.data || [];
                const coursesRes = await getCourses();
                const courses = coursesRes.data || [];

                const tbody = document.getElementById('topicsTable');

                if (topics.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="5"><div class="empty"><i class="fas fa-list"></i><h3>No topics yet</h3><p>Create your first topic</p></div></td></tr>`;
                    return;
                }

                tbody.innerHTML = topics.map((topic, index) => {
                    const course = courses.find(c => c.id === topic.courseId);
                    const topicLessons = lessons.filter(l => l.topicId === topic.id);
        
                    
                    return `
                        <tr>
                            <td>${index + 1}</td>
                            <td><strong>${topic.title}</strong></td>
                            <td>${course?.name || 'Unknown'}</td>
                            <td>${topicLessons.length}</td>
                            <td>
                                <button class="btn btn--warning btn--sm" onclick="editTopic(${topic.id})">
                                    <i class="fas fa-edit"></i>
                                </button>
                                <button class="btn btn--danger btn--sm" onclick="deleteTopicHandler(${topic.id})">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </td>
                        </tr>
                    `;
                }).join('');

            } catch (error) {
                showError('Failed to load topics: ' + error.message);
            }
        }

        window.editTopic = async function(id) {
            try {
                const res = await getTopics();
                const topic = res.data.find(t => t.id === id);
                if (!topic) return;

                await loadCoursesDropdown();
                document.getElementById('topicId').value = topic.id;
                document.getElementById('topicTitle').value = topic.title;
                document.getElementById('topicCourse').value = topic.courseId;
                document.getElementById('topicModalTitle').textContent = '✏️ Edit Topic';
                document.getElementById('topicSubmitBtn').innerHTML = '<i class="fas fa-save"></i> Update Topic';
                openModal('topicModal');
            } catch (error) {
                showError('Failed to load topic details');
            }
        };

        window.deleteTopicHandler = async function(id) {
            if (!confirm('Delete this topic and all its lessons?')) return;
            try {
                await deleteTopic(id);
                showToast('success', 'Deleted', 'Topic deleted successfully');
                loadTopics();
            } catch (error) {
                showError('Failed to delete topic: ' + error.message);
            }
        };

        document.getElementById('topicForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const id = document.getElementById('topicId').value;
            const title = document.getElementById('topicTitle').value.trim();
            const courseId = Number(document.getElementById('topicCourse').value);

            if (!title || !courseId) {
                showError('Please fill in all required fields.');
                return;
            }

            showLoading('topicSubmitBtn');

            try {
                if (id) {
                    await updateTopic(id, { title, courseId });
                    showToast('success', 'Updated', 'Topic updated successfully');
                } else {
                    await createTopic({ title, courseId });
                    showToast('success', 'Created', 'Topic created successfully');
                }

                closeModal('topicModal');
                this.reset();
                document.getElementById('topicId').value = '';
                document.getElementById('topicModalTitle').textContent = '➕ Add New Topic';
                document.getElementById('topicSubmitBtn').innerHTML = '<i class="fas fa-save"></i> Save Topic';
                loadTopics();
            } catch (error) {
                showError('Failed to save topic: ' + error.message);
            } finally {
                hideLoading('topicSubmitBtn');
            }
        });

        document.querySelector('#topicModal .modal__close').addEventListener('click', function() {
            document.getElementById('topicForm').reset();
            document.getElementById('topicId').value = '';
            document.getElementById('topicModalTitle').textContent = '➕ Add New Topic';
            document.getElementById('topicSubmitBtn').innerHTML = '<i class="fas fa-save"></i> Save Topic';
            closeModal('topicModal');
        });

        await loadCoursesDropdown();
        await loadTopics();

        document.querySelectorAll('.sidebar__link').forEach(link => {
            if (link.getAttribute('href') === 'topics.html') {
                link.classList.add('sidebar__link--active');
            }
        });

        window.openModal = openModal;
        window.closeModal = closeModal;
    </script>

</body>
</html>
