<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EZLearn — Manage Courses</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="css/dashboard.css" />

    <style>
        /* ======================================== */
        /* COURSES PAGE — NEW ELEMENTS ONLY         */
        /* ======================================== */

        .empty {
            text-align: center;
            padding: 48px 24px;
            color: var(--color-text-muted);
        }

        .empty i {
            font-size: 3rem;
            margin-bottom: 16px;
            opacity: 0.2;
            color: var(--color-primary);
            display: block;
        }

        .empty h3 {
            font-size: 1.125rem;
            color: var(--color-text-secondary);
            margin-bottom: 4px;
        }

        .empty p {
            font-size: 0.875rem;
            color: var(--color-text-muted);
        }

        /* ===== Modal ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: var(--color-bg-secondary);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-lg);
            max-width: 540px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 32px;
            animation: modalIn 0.3s var(--ease-out);
            box-shadow: var(--shadow-lg);
        }

        @keyframes modalIn {
            from {
                opacity: 0;
                transform: scale(0.95) translateY(20px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .modal__header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--color-border);
        }

        .modal__title {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--color-text-primary);
        }

        .modal__close {
            font-size: 1.5rem;
            color: var(--color-text-muted);
            cursor: pointer;
            transition: color var(--duration-fast) var(--ease-out);
            line-height: 1;
            padding: 4px 8px;
        }

        .modal__close:hover {
            color: var(--color-text-primary);
        }

        /* ===== Form ===== */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--color-text-secondary);
            margin-bottom: 6px;
        }

        .form-group .required {
            color: var(--color-error);
        }

        .form-group .hint {
            font-size: 0.75rem;
            color: var(--color-text-muted);
            margin-top: 4px;
            display: block;
        }

        .form-group .hint i {
            margin-right: 4px;
        }

        .form-control {
            width: 100%;
            padding: 12px 16px;
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
            color: var(--color-text-primary);
            font-size: 0.9375rem;
            font-family: var(--font-display);
            transition: all var(--duration-fast) var(--ease-out);
            outline: none;
        }

        .form-control:focus {
            border-color: var(--color-primary);
            box-shadow: 0 0 0 4px var(--color-primary-soft);
        }

        .form-control::placeholder {
            color: var(--color-text-muted);
        }

        .form-control[readonly] {
            opacity: 0.6;
            cursor: not-allowed;
        }

        textarea.form-control {
            resize: vertical;
            min-height: 80px;
        }

        .form-actions {
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid var(--color-border);
        }

        /* ===== Table Action Buttons ===== */
        .btn--warning {
            background: var(--color-warning);
            color: white;
        }

        .btn--warning:hover {
            background: #D97706;
            transform: translateY(-2px);
            box-shadow: 0 8px 32px rgba(245, 158, 11, 0.3);
        }

        .btn--danger {
            background: var(--color-error);
            color: white;
        }

        .btn--danger:hover {
            background: #DC2626;
            transform: translateY(-2px);
            box-shadow: 0 8px 32px rgba(239, 68, 68, 0.3);
        }

        .btn--sm {
            padding: 6px 12px;
            font-size: 0.75rem;
        }

        .btn--full {
            width: 100%;
            justify-content: center;
        }

        /* ===== Page Header ===== */
        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 32px;
            flex-wrap: wrap;
            gap: 16px;
        }

        .page-header__left h1 {
            font-size: 1.75rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--color-text-primary), var(--color-text-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.02em;
        }

        .page-header__left p {
            font-size: 0.9375rem;
            color: var(--color-text-secondary);
            margin-top: 2px;
        }

        .page-header__right {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        /* ======================================== */
        /* RESPONSIVE                              */
        /* ======================================== */
        @media (max-width: 768px) {
            .modal {
                padding: 24px 16px;
                margin: 12px;
            }

            .page-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .page-header__right {
                width: 100%;
            }

            .page-header__right .btn {
                flex: 1;
                justify-content: center;
            }

            .page-header__left h1 {
                font-size: 1.5rem;
            }
        }

        @media (max-width: 480px) {
            .modal {
                padding: 16px 12px;
            }

            .form-control {
                padding: 10px 12px;
                font-size: 0.875rem;
            }

            .modal__title {
                font-size: 1.1rem;
            }

            .btn--sm {
                padding: 4px 8px;
                font-size: 0.65rem;
            }
        }
    </style>
</head>
<body>

    <div class="toast-container" id="toastContainer"></div>

    <!-- ===== SIDEBAR ===== -->
    <aside class="sidebar">
        <div class="sidebar__logo">
            <svg width="32" height="32" viewBox="0 0 40 40" fill="none">
                <rect x="3" y="3" width="34" height="34" rx="8" stroke="#8B5CF6" stroke-width="2.5"/>
                <path d="M20 11L20 29M11 20L29 20" stroke="#8B5CF6" stroke-width="2.5" stroke-linecap="round"/>
                <circle cx="20" cy="20" r="4" stroke="#06B6D4" stroke-width="2"/>
                <circle cx="20" cy="20" r="2" fill="#06B6D4"/>
            </svg>
            <span class="sidebar__logo-text">EZLearn</span>
        </div>
        <nav class="sidebar__nav">
            <a href="index.html" class="sidebar__link"><i class="fas fa-chart-pie"></i><span>Dashboard</span></a>
            <a href="courses.html" class="sidebar__link sidebar__link--active"><i class="fas fa-book-open"></i><span>Courses</span></a>
            <a href="topics.html" class="sidebar__link"><i class="fas fa-list"></i><span>Topics</span></a>
            <a href="lessons.html" class="sidebar__link"><i class="fas fa-file-alt"></i><span>Lessons</span></a>
            <a href="users.html" class="sidebar__link"><i class="fas fa-users"></i><span>Users</span></a>
            <a href="feedbacks.html" class="sidebar__link"><i class="fas fa-comment-dots"></i><span>Feedbacks</span></a>
        </nav>
        <div class="sidebar__footer">
            <a href="../index.html" class="sidebar__link"><i class="fas fa-arrow-left"></i><span>Back to Site</span></a>
            <a href="#" class="sidebar__link" id="logoutBtn"><i class="fas fa-sign-out-alt"></i><span>Logout</span></a>
        </div>
    </aside>

    <!-- ===== MAIN ===== -->
    <main class="main-content">

        <div class="page-header">
            <div class="page-header__left">
                <h1><i class="fas fa-book-open" style="color: var(--color-primary);"></i> Courses</h1>
                <p>Manage all courses on your platform</p>
            </div>
            <div class="page-header__right">
                <button class="btn btn--primary" onclick="openModal('courseModal')">
                    <i class="fas fa-plus"></i> Add Course
                </button>
            </div>
        </div>

        <!-- ===== Course Table ===== -->
        <div class="card">
            <div class="card__header">
                <span class="card__title">📋 All Courses</span>
            </div>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Title</th>
                            <th>Slug</th>
                            <th>Description</th>
                            <th>Topics</th>
                            <th>Lessons</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="coursesTable">
                        <tr><td colspan="7"><div class="empty"><i class="fas fa-spinner fa-spin"></i><h3>Loading...</h3><p>Please wait</p></div></td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <!-- ===== MODAL: Add/Edit Course ===== -->
    <div class="modal-overlay" id="courseModal">
        <div class="modal">
            <div class="modal__header">
                <span class="modal__title" id="courseModalTitle">➕ Add New Course</span>
                <span class="modal__close" onclick="closeModal('courseModal')">&times;</span>
            </div>
            <form id="courseForm">
                <input type="hidden" id="courseId" value="" />
                <div class="form-group">
                    <label>Title <span class="required">*</span></label>
                    <input type="text" id="courseTitle" class="form-control" placeholder="e.g., React Complete Guide" required />
                </div>
                <div class="form-group">
                    <label>Slug <span class="required">*</span></label>
                    <input type="text" id="courseSlug" class="form-control" placeholder="e.g., react-complete-guide" required readonly />
                    <span class="hint"><i class="fas fa-info-circle"></i> Auto-generated from title (lowercase, hyphens)</span>
                </div>
                <div class="form-group">
                    <label>Description <span class="required">*</span></label>
                    <textarea id="courseDescription" class="form-control" rows="3" placeholder="Brief description of the course" required></textarea>
                </div>
                <div class="form-group">
                    <label>Thumbnail URL</label>
                    <input type="text" id="courseThumbnail" class="form-control" placeholder="https://example.com/image.jpg" />
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn--primary btn--full" id="courseSubmitBtn">
                        <i class="fas fa-save"></i> Save Course
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- ======================================== -->
    <!-- SCRIPTS                                  -->
    <!-- ======================================== -->
    <script type="module">
        // ========================================
        // IMPORTS
        // ========================================
        import { getCourses, createCourse, updateCourse, deleteCourse } from '../js/services/courseService.js';

        // ========================================
        // TOAST SYSTEM
        // ========================================
        function showToast(type, title, message) {
            const container = document.getElementById('toastContainer');
            if (!container) return;

            const existing = container.querySelectorAll('.toast');
            existing.forEach(t => t.remove());

            const toast = document.createElement('div');
            toast.className = `toast toast--${type}`;

            const icons = {
                success: 'fa-check-circle',
                error: 'fa-exclamation-circle',
                warning: 'fa-exclamation-triangle',
                info: 'fa-info-circle'
            };

            toast.innerHTML = `
                <div class="toast__icon"><i class="fas ${icons[type] || icons.info}"></i></div>
                <div class="toast__content">
                    <div class="toast__title">${title || 'Info'}</div>
                    <div class="toast__message">${message || ''}</div>
                </div>
                <button class="toast__close" onclick="this.closest('.toast').remove()"><i class="fas fa-times"></i></button>
            `;

            container.appendChild(toast);

            setTimeout(() => {
                if (toast.parentNode) {
                    toast.classList.add('toast--hiding');
                    setTimeout(() => toast.remove(), 300);
                }
            }, 4000);

            toast.addEventListener('click', () => {
                toast.classList.add('toast--hiding');
                setTimeout(() => toast.remove(), 300);
            });
        }

        function showError(message) {
            showToast('error', 'Error', message);
        }

        // ========================================
        // SLUG GENERATOR
        // ========================================
        function generateSlug(title) {
            if (!title) return '';
            return title
                .toLowerCase()
                .trim()
                .replace(/[^\w\s-]/g, '')
                .replace(/\s+/g, '-')
                .replace(/-+/g, '-');
        }

        // ========================================
        // MODAL SYSTEM
        // ========================================
        window.openModal = function(id) {
            const modal = document.getElementById(id);
            if (modal) modal.classList.add('active');
        };

        window.closeModal = function(id) {
            const modal = document.getElementById(id);
            if (modal) modal.classList.remove('active');
        };

        document.querySelectorAll('.modal-overlay').forEach(overlay => {
            overlay.addEventListener('click', function(e) {
                if (e.target === this) {
                    this.classList.remove('active');
                }
            });
        });

        // ========================================
        // LOADING HELPER
        // ========================================
        function setLoading(btn, loading) {
            if (!btn) return;
            if (loading) {
                btn.disabled = true;
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...';
            } else {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-save"></i> Save Course';
            }
        }

        // ========================================
        // AUTO-GENERATE SLUG FROM TITLE
        // ========================================
        document.getElementById('courseTitle').addEventListener('input', function() {
            const slugInput = document.getElementById('courseSlug');
            const isEdit = document.getElementById('courseId').value;
            if (!isEdit || !slugInput.value) {
                slugInput.value = generateSlug(this.value);
            }
        });

        // ========================================
        // AUTH CHECK
        // ========================================
        const token = sessionStorage.getItem('token');
        if (!token) {
            showToast('warning', 'Authentication Required', 'Please login to continue');
            setTimeout(() => {
                window.location.href = '../login.html';
            }, 1500);
        }

        // ========================================
        // LOGOUT
        // ========================================
        document.getElementById('logoutBtn').addEventListener('click', function(e) {
            e.preventDefault();
            if (confirm('Are you sure you want to logout?')) {
                sessionStorage.removeItem('token');
                sessionStorage.removeItem('user');
                window.location.href = '../login.html';
            }
        });

        // ========================================
        // LOAD COURSES — FIXED FOR API STRUCTURE
        // ========================================
        async function loadCourses() {
            const tbody = document.getElementById('coursesTable');

            try {
                tbody.innerHTML = `<tr><td colspan="7"><div class="empty"><i class="fas fa-spinner fa-spin"></i><h3>Loading...</h3><p>Please wait</p></div></td></tr>`;

                const response = await getCourses();
                const courses = response.data || [];

                if (courses.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="7"><div class="empty"><i class="fas fa-book-open"></i><h3>No courses yet</h3><p>Create your first course</p></div></td></tr>`;
                    return;
                }

                tbody.innerHTML = courses.map((course, index) => `
                    <tr>
                        <td>${index + 1}</td>
                        <td><strong>${course.name || 'Untitled'}</strong></td>
                        <td><code style="color: var(--color-text-muted); font-size: 0.75rem;">${course.slug || '—'}</code></td>
                        <td>${course.description?.substring(0, 40) || ''}${course.description?.length > 40 ? '...' : ''}</td>
                        <td>${course.totalTopics || 0}</td>
                        <td>${course.totalLessons || 0}</td>
                        <td>
                            <button class="btn btn--warning btn--sm" onclick="editCourse(${course.course_id})">
                                <i class="fas fa-edit"></i>
                            </button>
                            <button class="btn btn--danger btn--sm" onclick="deleteCourseHandler(${course.course_id})">
                                <i class="fas fa-trash"></i>
                            </button>
                        </td>
                    </tr>
                `).join('');

            } catch (error) {
                console.error('Load courses error:', error);
                tbody.innerHTML = `<tr><td colspan="7"><div class="empty"><i class="fas fa-exclamation-circle" style="color: var(--color-error);"></i><h3>Failed to load courses</h3><p>${error.message || 'Please try again'}</p></div></td></tr>`;
                showError('Failed to load courses: ' + (error.message || 'Unknown error'));
            }
        }

        // ========================================
        // EDIT COURSE — FIXED
        // ========================================
        window.editCourse = async function(courseId) {
            try {
                const response = await getCourses();
                const courses = response.data || [];
                const course = courses.find(c => c.course_id === courseId);

                if (!course) {
                    showError('Course not found');
                    return;
                }

                // Populate form fields
                document.getElementById('courseId').value = course.course_id;
                document.getElementById('courseTitle').value = course.name || '';
                document.getElementById('courseSlug').value = course.slug || '';
                document.getElementById('courseDescription').value = course.description || '';
                document.getElementById('courseThumbnail').value = course.thumbnail || '';

                // Update modal title and button
                document.getElementById('courseModalTitle').textContent = '✏️ Edit Course';
                document.getElementById('courseSubmitBtn').innerHTML = '<i class="fas fa-save"></i> Update Course';

                // Open modal
                openModal('courseModal');

            } catch (error) {
                console.error('Edit course error:', error);
                showError('Failed to load course details: ' + (error.message || 'Unknown error'));
            }
        };

        // ========================================
        // DELETE COURSE — FIXED
        // ========================================
        window.deleteCourseHandler = async function(courseId) {
            if (!confirm('Delete this course and all its topics & lessons?')) return;

            try {
                await deleteCourse(courseId);
                showToast('success', 'Deleted', 'Course deleted successfully');
                loadCourses();
            } catch (error) {
                console.error('Delete course error:', error);
                showError('Failed to delete course: ' + (error.message || 'Unknown error'));
            }
        };

        // ========================================
        // COURSE FORM SUBMIT — FIXED
        // ========================================
        document.getElementById('courseForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const id = document.getElementById('courseId').value;
            const title = document.getElementById('courseTitle').value.trim();
            const slug = document.getElementById('courseSlug').value.trim();
            const description = document.getElementById('courseDescription').value.trim();
            const thumbnail = document.getElementById('courseThumbnail').value.trim();

            // Validation
            if (!title) {
                showError('Please enter a course title.');
                return;
            }
            if (!slug) {
                showError('Please enter a course slug or generate it from title.');
                return;
            }
            if (!description) {
                showError('Please enter a course description.');
                return;
            }

            const submitBtn = document.getElementById('courseSubmitBtn');
            setLoading(submitBtn, true);

            try {
                const courseData = {
                    name: title,
                    slug: slug,
                    description: description,
                    thumbnail: thumbnail || undefined
                };

                if (id) {
                    // UPDATE — using course_id
                    await updateCourse(parseInt(id), courseData);
                    showToast('success', 'Updated', 'Course updated successfully');
                } else {
                    // CREATE
                    await createCourse(courseData);
                    showToast('success', 'Created', 'Course created successfully');
                }

                // Reset and close
                closeModal('courseModal');
                document.getElementById('courseForm').reset();
                document.getElementById('courseId').value = '';
                document.getElementById('courseModalTitle').textContent = '➕ Add New Course';
                document.getElementById('courseSubmitBtn').innerHTML = '<i class="fas fa-save"></i> Save Course';

                // Reload
                loadCourses();

            } catch (error) {
                console.error('Save course error:', error);
                const errorMsg = error.response?.data?.message || error.message || 'Unknown error';
                showError('Failed to save course: ' + errorMsg);
            } finally {
                setLoading(submitBtn, false);
            }
        });

        // ========================================
        // RESET MODAL ON CLOSE
        // ========================================
        document.querySelector('#courseModal .modal__close').addEventListener('click', function() {
            document.getElementById('courseForm').reset();
            document.getElementById('courseId').value = '';
            document.getElementById('courseModalTitle').textContent = '➕ Add New Course';
            document.getElementById('courseSubmitBtn').innerHTML = '<i class="fas fa-save"></i> Save Course';
        });

        // Close modal on Escape
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                const activeModal = document.querySelector('.modal-overlay.active');
                if (activeModal) {
                    activeModal.classList.remove('active');
                }
            }
        });

        // ========================================
        // SIDEBAR ACTIVE STATE
        // ========================================
        document.querySelectorAll('.sidebar__link').forEach(link => {
            if (link.getAttribute('href') === 'courses.html') {
                link.classList.add('sidebar__link--active');
            }
        });

        // ========================================
        // CONSOLE HELPERS
        // ========================================
        console.log('🚀 EZLearn — Courses Page v2.2');
        console.log('📚 Using real courseService API');
        console.log('🔗 Course ID field: course_id');
        console.log('💡 Keyboard shortcuts: Escape to close modal');

        // ========================================
        // INIT
        // ========================================
        loadCourses();

        // Expose functions globally
        window.openModal = openModal;
        window.closeModal = closeModal;
        window.editCourse = editCourse;
        window.deleteCourseHandler = deleteCourseHandler;
    </script>

</body>
</html>
