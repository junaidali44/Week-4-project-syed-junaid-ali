<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EZLearn — Manage Courses</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="css/admin.css" />
</head>
<body>

    <div class="toast-container" id="toastContainer"></div>

    <!-- ===== SIDEBAR ===== -->
    <aside class="sidebar">
        <div class="sidebar__logo">
            <svg width="32" height="32" viewBox="0 0 40 40" fill="none">
                <rect x="3" y="3" width="34" height="34" rx="8" stroke="#8B5CF6" stroke-width="2.5"/>
                <path d="M20 11L20 29M11 20L29 20" stroke="#8B5CF6" stroke-width="2.5" stroke-linecap="round"/>
                <circle cx="20" cy="20" r="4" stroke="#06B6D4" stroke-width="2"/>
                <circle cx="20" cy="20" r="2" fill="#06B6D4"/>
            </svg>
            <span class="sidebar__logo-text">EZLearn</span>
        </div>
        <nav class="sidebar__nav">
            <a href="index.html" class="sidebar__link"><i class="fas fa-chart-pie"></i><span>Dashboard</span></a>
            <a href="courses.html" class="sidebar__link sidebar__link--active"><i class="fas fa-book-open"></i><span>Courses</span></a>
            <a href="topics.html" class="sidebar__link"><i class="fas fa-list"></i><span>Topics</span></a>
            <a href="lessons.html" class="sidebar__link"><i class="fas fa-file-alt"></i><span>Lessons</span></a>
            <a href="users.html" class="sidebar__link"><i class="fas fa-users"></i><span>Users</span></a>
            <a href="feedbacks.html" class="sidebar__link"><i class="fas fa-comment-dots"></i><span>Feedbacks</span></a>
        </nav>
        <div class="sidebar__footer">
            <a href="../index.html" class="sidebar__link"><i class="fas fa-arrow-left"></i><span>Back to Site</span></a>
            <a href="#" class="sidebar__link" id="logoutBtn"><i class="fas fa-sign-out-alt"></i><span>Logout</span></a>
        </div>
    </aside>

    <!-- ===== MAIN ===== -->
    <main class="main">

        <div class="page-header">
            <div class="page-header__left">
                <h1>📚 Courses</h1>
                <p>Manage all courses on your platform</p>
            </div>
            <div class="page-header__right">
                <button class="btn btn--primary" onclick="openModal('courseModal')">
                    <i class="fas fa-plus"></i> Add Course
                </button>
            </div>
        </div>

        <!-- ===== Course Table ===== -->
        <div class="card">
            <div class="card__header">
                <span class="card__title">📋 All Courses</span>
            </div>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Title</th>
                            <th>Description</th>
                            <th>Topics</th>
                            <th>Lessons</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="coursesTable">
                        <tr><td colspan="6"><div class="empty"><i class="fas fa-book-open"></i><h3>No courses yet</h3><p>Create your first course</p></div></td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <!-- ===== MODAL: Add/Edit Course ===== -->
    <div class="modal-overlay" id="courseModal">
        <div class="modal">
            <div class="modal__header">
                <span class="modal__title" id="courseModalTitle">➕ Add New Course</span>
                <span class="modal__close" onclick="closeModal('courseModal')">&times;</span>
            </div>
            <form id="courseForm">
                <input type="hidden" id="courseId" value="" />
                <div class="form-group">
                    <label>Title <span class="required">*</span></label>
                    <input type="text" id="courseTitle" class="form-control" placeholder="e.g., React Complete Guide" required />
                </div>
                <div class="form-group">
                    <label>Description <span class="required">*</span></label>
                    <textarea id="courseDescription" class="form-control" rows="3" placeholder="Brief description of the course" required></textarea>
                </div>
                <div class="form-group">
                    <label>Thumbnail URL</label>
                    <input type="text" id="courseThumbnail" class="form-control" placeholder="https://example.com/image.jpg" />
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn--primary btn--full" id="courseSubmitBtn">
                        <i class="fas fa-save"></i> Save Course
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script type="module">
        import { showToast, showError, showLoading, hideLoading, openModal, closeModal } from '../js/components/ui.mjs';
        import { getCourses, createCourse, updateCourse, deleteCourse } from '../js/services/courseService.js';
        import { getTopics } from '../js/services/topicService.js';
        import { getLessons } from '../js/services/lessonsService.js';

        // ===== Check Auth =====
        if (!sessionStorage.getItem('token')) window.location.href = '../login.html';

        // ===== Logout =====
        document.getElementById('logoutBtn').addEventListener('click', () => {
            if (confirm('Logout?')) {
                sessionStorage.removeItem('token');
                sessionStorage.removeItem('user');
                window.location.href = '../login.html';
            }
        });

        // ===== Load Courses =====
        async function loadCourses() {
            try {
                const [coursesRes, topicsRes, lessonsRes] = await Promise.all([
                    getCourses(),
                    getTopics().catch(() => ({ data: [] })),
                    getLessons().catch(() => ({ data: [] }))
                ]);

                const courses = coursesRes.data || [];
                const topics = topicsRes.data || [];
                const lessons = lessonsRes.data || [];

                const tbody = document.getElementById('coursesTable');

                if (courses.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="6"><div class="empty"><i class="fas fa-book-open"></i><h3>No courses yet</h3><p>Create your first course</p></div></td></tr>`;
                    return;
                }

                tbody.innerHTML = courses.map((course, index) => {
                    const courseTopics = topics.filter(t => t.courseId === course.id);
                    const courseLessons = lessons.filter(l => courseTopics.some(t => t.id === l.topicId));
                    return `
                        <tr>
                            <td>${index + 1}</td>
                            <td><strong>${course.title}</strong></td>
                            <td>${course.description?.substring(0, 50) || ''}${course.description?.length > 50 ? '...' : ''}</td>
                            <td>${courseTopics.length}</td>
                            <td>${courseLessons.length}</td>
                            <td>
                                <button class="btn btn--warning btn--sm" onclick="editCourse(${course.id})">
                                    <i class="fas fa-edit"></i>
                                </button>
                                <button class="btn btn--danger btn--sm" onclick="deleteCourseHandler(${course.id})">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </td>
                        </tr>
                    `;
                }).join('');

            } catch (error) {
                showError('Failed to load courses: ' + error.message);
            }
        }

        // ===== Edit Course =====
        window.editCourse = async function(id) {
            try {
                const res = await getCourses();
                const course = res.data.find(c => c.id === id);
                if (!course) return;

                document.getElementById('courseId').value = course.id;
                document.getElementById('courseTitle').value = course.title;
                document.getElementById('courseDescription').value = course.description || '';
                document.getElementById('courseThumbnail').value = course.thumbnail || '';
                document.getElementById('courseModalTitle').textContent = '✏️ Edit Course';
                document.getElementById('courseSubmitBtn').innerHTML = '<i class="fas fa-save"></i> Update Course';
                openModal('courseModal');
            } catch (error) {
                showError('Failed to load course details');
            }
        };

        // ===== Delete Course =====
        window.deleteCourseHandler = async function(id) {
            if (!confirm('Delete this course and all its topics & lessons?')) return;
            try {
                await deleteCourse(id);
                showToast('success', 'Deleted', 'Course deleted successfully');
                loadCourses();
            } catch (error) {
                showError('Failed to delete course: ' + error.message);
            }
        };

        // ===== Course Form Submit =====
        document.getElementById('courseForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const id = document.getElementById('courseId').value;
            const title = document.getElementById('courseTitle').value.trim();
            const description = document.getElementById('courseDescription').value.trim();
            const thumbnail = document.getElementById('courseThumbnail').value.trim();

            if (!title || !description) {
                showError('Please fill in all required fields.');
                return;
            }

            showLoading('courseSubmitBtn');

            try {
                if (id) {
                    await updateCourse(id, { title, description, thumbnail });
                    showToast('success', 'Updated', 'Course updated successfully');
                } else {
                    await createCourse({ title, description, thumbnail });
                    showToast('success', 'Created', 'Course created successfully');
                }

                closeModal('courseModal');
                this.reset();
                document.getElementById('courseId').value = '';
                document.getElementById('courseModalTitle').textContent = '➕ Add New Course';
                document.getElementById('courseSubmitBtn').innerHTML = '<i class="fas fa-save"></i> Save Course';
                loadCourses();
            } catch (error) {
                showError('Failed to save course: ' + error.message);
            } finally {
                hideLoading('courseSubmitBtn');
            }
        });

        // ===== Reset Modal on Close =====
        document.querySelector('#courseModal .modal__close').addEventListener('click', function() {
            document.getElementById('courseForm').reset();
            document.getElementById('courseId').value = '';
            document.getElementById('courseModalTitle').textContent = '➕ Add New Course';
            document.getElementById('courseSubmitBtn').innerHTML = '<i class="fas fa-save"></i> Save Course';
            closeModal('courseModal');
        });

        // ===== Init =====
        loadCourses();

        // ===== Sidebar Active =====
        document.querySelectorAll('.sidebar__link').forEach(link => {
            if (link.getAttribute('href') === 'courses.html') {
                link.classList.add('sidebar__link--active');
            }
        });

        // Expose functions globally
        window.openModal = openModal;
        window.closeModal = closeModal;
    </script>

</body>
</html>
