<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EZLearn — Manage Users</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="css/admin.css" />
</head>
<body>

    <div class="toast-container" id="toastContainer"></div>

    <aside class="sidebar">
        <div class="sidebar__logo">
            <svg width="32" height="32" viewBox="0 0 40 40" fill="none">
                <rect x="3" y="3" width="34" height="34" rx="8" stroke="#8B5CF6" stroke-width="2.5"/>
                <path d="M20 11L20 29M11 20L29 20" stroke="#8B5CF6" stroke-width="2.5" stroke-linecap="round"/>
                <circle cx="20" cy="20" r="4" stroke="#06B6D4" stroke-width="2"/>
                <circle cx="20" cy="20" r="2" fill="#06B6D4"/>
            </svg>
            <span class="sidebar__logo-text">EZLearn</span>
        </div>
        <nav class="sidebar__nav">
            <a href="index.html" class="sidebar__link"><i class="fas fa-chart-pie"></i><span>Dashboard</span></a>
            <a href="courses.html" class="sidebar__link"><i class="fas fa-book-open"></i><span>Courses</span></a>
            <a href="topics.html" class="sidebar__link"><i class="fas fa-list"></i><span>Topics</span></a>
            <a href="lessons.html" class="sidebar__link"><i class="fas fa-file-alt"></i><span>Lessons</span></a>
            <a href="users.html" class="sidebar__link sidebar__link--active"><i class="fas fa-users"></i><span>Users</span></a>
            <a href="feedbacks.html" class="sidebar__link"><i class="fas fa-comment-dots"></i><span>Feedbacks</span></a>
        </nav>
        <div class="sidebar__footer">
            <a href="../index.html" class="sidebar__link"><i class="fas fa-arrow-left"></i><span>Back to Site</span></a>
            <a href="#" class="sidebar__link" id="logoutBtn"><i class="fas fa-sign-out-alt"></i><span>Logout</span></a>
        </div>
    </aside>

    <main class="main">

        <div class="page-header">
            <div class="page-header__left">
                <h1>👤 Users</h1>
                <p>Manage all registered users</p>
            </div>
        </div>

        <div class="card">
            <div class="card__header">
                <span class="card__title">📋 Registered Users</span>
            </div>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr><th>#</th><th>Name</th><th>Email</th><th>Role</th><th>Joined</th><th>Actions</th></tr>
                    </thead>
                    <tbody id="usersTable">
                        <tr><td colspan="6"><div class="empty"><i class="fas fa-users"></i><h3>No users yet</h3></div></td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <!-- ===== MODAL: Edit User ===== -->
    <div class="modal-overlay" id="userModal">
        <div class="modal">
            <div class="modal__header">
                <span class="modal__title">✏️ Edit User</span>
                <span class="modal__close" onclick="closeModal('userModal')">&times;</span>
            </div>
            <form id="userForm">
                <input type="hidden" id="userId" value="" />
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" id="userName" class="form-control" disabled />
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="text" id="userEmail" class="form-control" disabled />
                </div>
                <div class="form-group">
                    <label>Role <span class="required">*</span></label>
                    <select id="userRole" class="form-control" required>
                        <option value="user">User</option>
                        <option value="admin">Admin</option>
                    </select>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn--primary btn--full" id="userSubmitBtn">
                        <i class="fas fa-save"></i> Update Role
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script type="module">
        import { showToast, showError, showLoading, hideLoading, openModal, closeModal } from '../components/ui.js';
        import { getUsers, updateUserRole, deleteUser } from '../js/services/userService.js';

        if (!sessionStorage.getItem('token')) window.location.href = '../login.html';

        document.getElementById('logoutBtn').addEventListener('click', () => {
            if (confirm('Logout?')) {
                sessionStorage.removeItem('token');
                sessionStorage.removeItem('user');
                window.location.href = '../login.html';
            }
        });

        async function loadUsers() {
            try {
                const res = await getUsers();
                const users = res.data || [];

                const tbody = document.getElementById('usersTable');

                if (users.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="6"><div class="empty"><i class="fas fa-users"></i><h3>No users yet</h3></div></td></tr>`;
                    return;
                }

                tbody.innerHTML = users.map((user, index) => `
                    <tr>
                        <td>${index + 1}</td>
                        <td><strong>${user.name}</strong></td>
                        <td>${user.email}</td>
                        <td><span class="badge badge--${user.role === 'admin' ? 'primary' : 'info'}">${user.role || 'User'}</span></td>
                        <td>${user.createdAt ? new Date(user.createdAt).toLocaleDateString() : 'N/A'}</td>
                        <td>
                            <button class="btn btn--warning btn--sm" onclick="editUser(${user.id}, '${user.role}')">
                                <i class="fas fa-edit"></i>
                            </button>
                            <button class="btn btn--danger btn--sm" onclick="deleteUserHandler(${user.id})">
                                <i class="fas fa-trash"></i>
                            </button>
                        </td>
                    </tr>
                `).join('');

            } catch (error) {
                showError('Failed to load users: ' + error.message);
            }
        }

        window.editUser = function(id, role) {
            document.getElementById('userId').value = id;
            document.getElementById('userRole').value = role || 'user';
            openModal('userModal');
        };

        window.deleteUserHandler = async function(id) {
            if (!confirm('Delete this user?')) return;
            try {
                await deleteUser(id);
                showToast('success', 'Deleted', 'User deleted successfully');
                loadUsers();
            } catch (error) {
                showError('Failed to delete user: ' + error.message);
            }
        };

        document.getElementById('userForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const id = document.getElementById('userId').value;
            const role = document.getElementById('userRole').value;

            if (!id || !role) {
                showError('Please select a role.');
                return;
            }

            showLoading('userSubmitBtn');

            try {
                await updateUserRole(id, role);
                showToast('success', 'Updated', 'User role updated successfully');
                closeModal('userModal');
                loadUsers();
            } catch (error) {
                showError('Failed to update user: ' + error.message);
            } finally {
                hideLoading('userSubmitBtn');
            }
        });

        loadUsers();

        document.querySelectorAll('.sidebar__link').forEach(link => {
            if (link.getAttribute('href') === 'users.html') {
                link.classList.add('sidebar__link--active');
            }
        });

        window.openModal = openModal;
        window.closeModal = closeModal;
    </script>

</body>
</html>
