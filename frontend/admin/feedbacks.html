<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EZLearn — Manage Feedbacks</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="css/admin.css" />
</head>
<body>

    <div class="toast-container" id="toastContainer"></div>

    <aside class="sidebar">
        <div class="sidebar__logo">
            <svg width="32" height="32" viewBox="0 0 40 40" fill="none">
                <rect x="3" y="3" width="34" height="34" rx="8" stroke="#8B5CF6" stroke-width="2.5"/>
                <path d="M20 11L20 29M11 20L29 20" stroke="#8B5CF6" stroke-width="2.5" stroke-linecap="round"/>
                <circle cx="20" cy="20" r="4" stroke="#06B6D4" stroke-width="2"/>
                <circle cx="20" cy="20" r="2" fill="#06B6D4"/>
            </svg>
            <span class="sidebar__logo-text">EZLearn</span>
        </div>
        <nav class="sidebar__nav">
            <a href="index.html" class="sidebar__link"><i class="fas fa-chart-pie"></i><span>Dashboard</span></a>
            <a href="courses.html" class="sidebar__link"><i class="fas fa-book-open"></i><span>Courses</span></a>
            <a href="topics.html" class="sidebar__link"><i class="fas fa-list"></i><span>Topics</span></a>
            <a href="lessons.html" class="sidebar__link"><i class="fas fa-file-alt"></i><span>Lessons</span></a>
            <a href="users.html" class="sidebar__link"><i class="fas fa-users"></i><span>Users</span></a>
            <a href="feedbacks.html" class="sidebar__link sidebar__link--active"><i class="fas fa-comment-dots"></i><span>Feedbacks</span></a>
        </nav>
        <div class="sidebar__footer">
            <a href="../index.html" class="sidebar__link"><i class="fas fa-arrow-left"></i><span>Back to Site</span></a>
            <a href="#" class="sidebar__link" id="logoutBtn"><i class="fas fa-sign-out-alt"></i><span>Logout</span></a>
        </div>
    </aside>

    <main class="main">

        <div class="page-header">
            <div class="page-header__left">
                <h1>💬 Feedbacks</h1>
                <p>View all user feedbacks</p>
            </div>
        </div>

        <div class="card">
            <div class="card__header">
                <span class="card__title">📋 All Feedbacks</span>
            </div>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr><th>#</th><th>User</th><th>Rating</th><th>Message</th><th>Date</th><th>Actions</th></tr>
                    </thead>
                    <tbody id="feedbacksTable">
                        <tr><td colspan="6"><div class="empty"><i class="fas fa-comment"></i><h3>No feedbacks yet</h3></div></td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- ===== Feedback Cards ===== -->
        <div class="stats" style="grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));" id="feedbackCards">
            <!-- Rendered by JS -->
        </div>

    </main>

    <script type="module">
        import { showToast, showError } from '../js/components/ui.js';
        import { getFeedbacks, deleteFeedback } from '../js/services/feedbackService.js';
        
        if (!sessionStorage.getItem('token')) window.location.href = '../login.html';

        document.getElementById('logoutBtn').addEventListener('click', () => {
            if (confirm('Logout?')) {
                sessionStorage.removeItem('token');
                sessionStorage.removeItem('user');
                window.location.href = '../login.html';
            }
        });

        function renderStars(rating) {
            return '⭐'.repeat(rating) + '☆'.repeat(5 - rating);
        }

        async function loadFeedbacks() {
            try {
                const res = await getFeedbacks();
                const feedbacks = res.data || [];

                // Table
                const tbody = document.getElementById('feedbacksTable');

                if (feedbacks.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="6"><div class="empty"><i class="fas fa-comment"></i><h3>No feedbacks yet</h3></div></td></tr>`;
                } else {
                    tbody.innerHTML = feedbacks.map((fb, index) => `
                        <tr>
                            <td>${index + 1}</td>
                            <td><strong>${fb.user || 'Anonymous'}</strong></td>
                            <td>${renderStars(fb.rating)}</td>
                            <td>${fb.message?.substring(0, 60) || ''}${fb.message?.length > 60 ? '...' : ''}</td>
                            <td>${fb.createdAt ? new Date(fb.createdAt).toLocaleDateString() : 'N/A'}</td>
                            <td>
                                <button class="btn btn--danger btn--sm" onclick="deleteFeedbackHandler(${fb.id})">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </td>
                        </tr>
                    `).join('');
                }

                // Cards
                const cardsContainer = document.getElementById('feedbackCards');

                if (feedbacks.length === 0) {
                    cardsContainer.innerHTML = `<div class="empty" style="grid-column: 1 / -1;"><i class="fas fa-comment"></i><h3>No feedbacks yet</h3></div>`;
                } else {
                    cardsContainer.innerHTML = feedbacks.map(fb => `
                        <div class="stat" style="display: flex; flex-direction: column; gap: 8px;">
                            <div style="display: flex; align-items: center; justify-content: space-between;">
                                <strong style="color: var(--text-primary);">${fb.user || 'Anonymous'}</strong>
                                <span style="font-size: 0.875rem;">${renderStars(fb.rating)}</span>
                            </div>
                            <p style="color: var(--text-secondary); font-size: 0.875rem; margin: 4px 0;">${fb.message || ''}</p>
                            <span style="font-size: 0.75rem; color: var(--text-muted);">${fb.createdAt ? new Date(fb.createdAt).toLocaleDateString() : 'N/A'}</span>
                        </div>
                    `).join('');
                }

            } catch (error) {
                showError('Failed to load feedbacks: ' + error.message);
            }
        }

        window.deleteFeedbackHandler = async function(id) {
            if (!confirm('Delete this feedback?')) return;
            try {
                await deleteFeedback(id);
                showToast('success', 'Deleted', 'Feedback deleted successfully');
                loadFeedbacks();
            } catch (error) {
                showError('Failed to delete feedback: ' + error.message);
            }
        };

        loadFeedbacks();

        document.querySelectorAll('.sidebar__link').forEach(link => {
            if (link.getAttribute('href') === 'feedbacks.html') {
                link.classList.add('sidebar__link--active');
            }
        });
    </script>

</body>
</html>
