<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="EZLearn — Your Profile Dashboard" />
    <meta name="theme-color" content="#0A0E1A" />
    <title>EZLearn — My Profile</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <!-- Auth Styles -->
    <link rel="stylesheet" href="css/auth.css" />

    <style>
        /* ======================================== */
        /* PROFILE PAGE — DASHBOARD STYLES         */
        /* ======================================== */

        .profile-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 800px;
            padding: 20px;
            margin: 0 auto;
            animation: authFadeUp 0.8s var(--ease-out) forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        .profile-card {
            padding: 40px 36px;
            background: var(--color-surface);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-lg);
            box-shadow: 0 8px 64px rgba(0, 0, 0, 0.4);
            transition: all var(--duration-base) var(--ease-out);
        }

        .profile-card:hover {
            border-color: rgba(255, 255, 255, 0.12);
        }

        /* ===== Profile Header ===== */
        .profile-header {
            display: flex;
            align-items: center;
            gap: 28px;
            padding-bottom: 28px;
            border-bottom: 1px solid var(--color-border);
            margin-bottom: 28px;
        }

        .profile-avatar {
            position: relative;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--color-primary), var(--color-secondary));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            font-weight: 700;
            color: white;
            box-shadow: 0 0 60px var(--color-primary-glow);
            flex-shrink: 0;
            user-select: none;
            transition: all var(--duration-base) var(--ease-out);
        }

        .profile-avatar:hover {
            transform: scale(1.05);
            box-shadow: 0 0 80px var(--color-primary-glow);
        }

        .profile-info {
            flex: 1;
            min-width: 0;
        }

        .profile-name {
            font-family: var(--font-display);
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--color-text-primary);
            margin-bottom: 2px;
        }

        .profile-email {
            font-size: 0.9375rem;
            color: var(--color-text-secondary);
        }

        .profile-role {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 16px;
            border-radius: var(--radius-full);
            background: var(--color-primary-soft);
            color: var(--color-primary);
            font-size: 0.75rem;
            font-weight: 500;
            margin-top: 6px;
            border: 1px solid var(--color-border);
        }

        .profile-role i {
            font-size: 0.65rem;
        }

        /* ===== Stats Grid ===== */
        .profile-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
            margin-bottom: 28px;
            padding-bottom: 28px;
            border-bottom: 1px solid var(--color-border);
        }

        .stat-item {
            background: var(--color-bg-secondary);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            padding: 18px 20px;
            text-align: center;
            transition: all var(--duration-fast) var(--ease-out);
        }

        .stat-item:hover {
            border-color: var(--color-border-focus);
            transform: translateY(-2px);
        }

        .stat-item__value {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--color-text-primary);
            display: block;
        }

        .stat-item__label {
            font-size: 0.75rem;
            color: var(--color-text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-top: 2px;
        }

        .stat-item__icon {
            display: block;
            font-size: 1.25rem;
            color: var(--color-primary);
            margin-bottom: 6px;
        }

        /* ===== Profile Details Grid ===== */
        .profile-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px 24px;
            margin-bottom: 28px;
            padding-bottom: 28px;
            border-bottom: 1px solid var(--color-border);
        }

        .detail-item {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .detail-item__label {
            font-size: 0.7rem;
            font-weight: 500;
            color: var(--color-text-muted);
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        .detail-item__value {
            font-size: 0.9375rem;
            color: var(--color-text-primary);
            font-weight: 500;
        }

        .detail-item__value i {
            color: var(--color-primary);
            margin-right: 6px;
            font-size: 0.8rem;
        }

        /* ===== Quick Links ===== */
        .profile-links {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
            margin-bottom: 24px;
            padding-bottom: 24px;
            border-bottom: 1px solid var(--color-border);
        }

        .quick-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 18px;
            background: var(--color-bg-secondary);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
            color: var(--color-text-secondary);
            text-decoration: none;
            transition: all var(--duration-fast) var(--ease-out);
        }

        .quick-link:hover {
            border-color: var(--color-primary);
            color: var(--color-text-primary);
            transform: translateX(4px);
            background: var(--color-primary-soft);
        }

        .quick-link i {
            font-size: 1rem;
            color: var(--color-primary);
            width: 20px;
            text-align: center;
            flex-shrink: 0;
        }

        .quick-link span {
            font-size: 0.875rem;
            font-weight: 500;
        }

        /* ===== Logout Button ===== */
        .logout-wrapper {
            display: flex;
            justify-content: flex-end;
            margin-top: 4px;
        }

        .auth-btn--danger {
            background: transparent;
            color: #EF4444;
            border: 1px solid rgba(239, 68, 68, 0.2);
            padding: 12px 28px;
            border-radius: var(--radius-sm);
            font-family: var(--font-display);
            font-weight: 600;
            font-size: 0.875rem;
            cursor: pointer;
            transition: all var(--duration-fast) var(--ease-out);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .auth-btn--danger:hover {
            background: rgba(239, 68, 68, 0.1);
            border-color: rgba(239, 68, 68, 0.3);
            color: #F87171;
            transform: translateY(-2px);
        }

        /* ======================================== */
        /* RESPONSIVE                              */
        /* ======================================== */

        @media (max-width: 768px) {
            .profile-container {
                padding: 12px;
            }

            .profile-card {
                padding: 24px 20px;
            }

            .profile-header {
                flex-direction: column;
                align-items: center;
                text-align: center;
                gap: 16px;
            }

            .profile-avatar {
                width: 80px;
                height: 80px;
                font-size: 2rem;
            }

            .profile-name {
                font-size: 1.5rem;
            }

            .profile-details {
                grid-template-columns: 1fr;
                gap: 12px;
            }

            .profile-stats {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }

            .profile-links {
                grid-template-columns: 1fr;
            }

            .logout-wrapper {
                justify-content: center;
            }

            .stat-item {
                padding: 14px 16px;
            }

            .stat-item__value {
                font-size: 1.25rem;
            }
        }

        @media (max-width: 480px) {
            .profile-stats {
                grid-template-columns: 1fr 1fr;
                gap: 8px;
            }

            .stat-item {
                padding: 12px 14px;
            }

            .stat-item__value {
                font-size: 1.1rem;
            }

            .quick-link {
                padding: 12px 14px;
            }

            .auth-btn--danger {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body class="auth-body">

    <!-- ===== BACKGROUND ORBS ===== -->
    <div class="auth-bg-orb auth-bg-orb--1"></div>
    <div class="auth-bg-orb auth-bg-orb--2"></div>
    <div class="auth-bg-orb auth-bg-orb--3"></div>

    <!-- ===== TOAST CONTAINER ===== -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- ===== PROFILE CONTAINER ===== -->
    <div class="profile-container">
        <div class="profile-card">

            <!-- ===== Profile Header ===== -->
            <div class="profile-header">
                <div class="profile-avatar" id="avatarDisplay">
                    <span id="avatarInitials">JD</span>
                </div>
                <div class="profile-info">
                    <h1 class="profile-name" id="profileName">John Doe</h1>
                    <p class="profile-email" id="profileEmail">john.doe@example.com</p>
                    <span class="profile-role" id="profileRole">
                        <i class="fas fa-user-check"></i> User
                    </span>
                </div>
            </div>

            <!-- ===== Stats ===== -->
            <div class="profile-stats" id="profileStats">
                <div class="stat-item">
                    <span class="stat-item__icon"><i class="fas fa-book-open"></i></span>
                    <span class="stat-item__value" id="statCourses">0</span>
                    <span class="stat-item__label">Total Courses</span>
                </div>
                <div class="stat-item">
                    <span class="stat-item__icon"><i class="fas fa-list"></i></span>
                    <span class="stat-item__value" id="statTopics">0</span>
                    <span class="stat-item__label">Total Topics</span>
                </div>
                <div class="stat-item">
                    <span class="stat-item__icon"><i class="fas fa-file-alt"></i></span>
                    <span class="stat-item__value" id="statLessons">0</span>
                    <span class="stat-item__label">Total Lessons</span>
                </div>
                <div class="stat-item">
                    <span class="stat-item__icon"><i class="fas fa-comment-dots"></i></span>
                    <span class="stat-item__value" id="statFeedbacks">0</span>
                    <span class="stat-item__label">Feedbacks</span>
                </div>
            </div>

            <!-- ===== Profile Details ===== -->
            <div class="profile-details">
                <div class="detail-item">
                    <span class="detail-item__label">Full Name</span>
                    <span class="detail-item__value" id="detailName">—</span>
                </div>
                <div class="detail-item">
                    <span class="detail-item__label">Email Address</span>
                    <span class="detail-item__value" id="detailEmail">—</span>
                </div>
                <div class="detail-item">
                    <span class="detail-item__label">Role</span>
                    <span class="detail-item__value" id="detailRole">—</span>
                </div>
                <div class="detail-item">
                    <span class="detail-item__label">Member Since</span>
                    <span class="detail-item__value" id="detailMemberSince">—</span>
                </div>
                <div class="detail-item">
                    <span class="detail-item__label">Account Status</span>
                    <span class="detail-item__value" id="detailStatus">
                        <i class="fas fa-circle" style="color: #34D399; font-size: 0.6rem;"></i> Active
                    </span>
                </div>
                <div class="detail-item">
                    <span class="detail-item__label">User ID</span>
                    <span class="detail-item__value" id="detailUserId" style="font-family: monospace; font-size: 0.8rem;">—</span>
                </div>
            </div>

            <!-- ===== Quick Links ===== -->
            <div class="profile-links">
                <a href="../index.html" class="quick-link">
                    <i class="fas fa-home"></i>
                    <span>Homepage</span>
                </a>
                <a href="courses.html" class="quick-link">
                    <i class="fas fa-book-open"></i>
                    <span>Courses</span>
                </a>
                <a href="feedback.html" class="quick-link">
                    <i class="fas fa-comment-dots"></i>
                    <span>Submit Feedback</span>
                </a>
            </div>

            <!-- ===== Logout ===== -->
            <div class="logout-wrapper">
                <button class="auth-btn--danger" id="logoutBtn">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </button>
            </div>

        </div>
    </div>

    <!-- ======================================== -->
    <!-- SCRIPTS                                  -->
    <!-- ======================================== -->
    <script type="module">
        // ========================================
        // IMPORTS
        // ========================================
        import { isLoggedIn, logout, getUser } from './js/utils/auth.js';
        import { profile } from './js/services/authService.js';
        import { getDashboardStats } from './js/services/dashboardService.js';

        // ========================================
        // TOAST SYSTEM
        // ========================================
        function showToast(type, title, message) {
            const container = document.getElementById('toastContainer');
            if (!container) return;

            const existing = container.querySelectorAll('.toast');
            existing.forEach(t => t.remove());

            const toast = document.createElement('div');
            toast.className = `toast toast--${type}`;

            const icons = {
                success: 'fa-check-circle',
                error: 'fa-exclamation-circle',
                warning: 'fa-exclamation-triangle',
                info: 'fa-info-circle'
            };

            toast.innerHTML = `
                <div class="toast__icon"><i class="fas ${icons[type] || icons.info}"></i></div>
                <div class="toast__content">
                    <div class="toast__title">${title || 'Info'}</div>
                    <div class="toast__message">${message || ''}</div>
                </div>
                <button class="toast__close" onclick="this.closest('.toast').remove()"><i class="fas fa-times"></i></button>
            `;

            container.appendChild(toast);

            setTimeout(() => {
                if (toast.parentNode) {
                    toast.classList.add('toast--hiding');
                    setTimeout(() => toast.remove(), 300);
                }
            }, 4000);

            toast.addEventListener('click', () => {
                toast.classList.add('toast--hiding');
                setTimeout(() => toast.remove(), 300);
            });
        }

        // ========================================
        // DOM REFS
        // ========================================
        const avatarInitials = document.getElementById('avatarInitials');
        const profileName = document.getElementById('profileName');
        const profileEmail = document.getElementById('profileEmail');
        const profileRole = document.getElementById('profileRole');
        const detailName = document.getElementById('detailName');
        const detailEmail = document.getElementById('detailEmail');
        const detailRole = document.getElementById('detailRole');
        const detailMemberSince = document.getElementById('detailMemberSince');
        const detailUserId = document.getElementById('detailUserId');
        const logoutBtn = document.getElementById('logoutBtn');

        // Stats
        const statCourses = document.getElementById('statCourses');
        const statTopics = document.getElementById('statTopics');
        const statLessons = document.getElementById('statLessons');
        const statFeedbacks = document.getElementById('statFeedbacks');

        // ========================================
        // HELPERS
        // ========================================
        function getInitials(name) {
            if (!name) return '??';
            const parts = name.trim().split(/\s+/);
            if (parts.length === 0) return '??';
            if (parts.length === 1) return parts[0].substring(0, 2).toUpperCase();
            return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
        }

        function formatDate(dateString) {
            if (!dateString) return '—';
            const d = new Date(dateString);
            if (isNaN(d.getTime())) return '—';
            return d.toLocaleDateString('en-US', {
                month: 'long',
                day: 'numeric',
                year: 'numeric'
            });
        }

        // ========================================
        // RENDER PROFILE
        // ========================================
        function renderProfile(user) {
            if (!user) return;

            const name = user.name || 'User';
            const email = user.email || '—';
            const role = user.role || 'user';
            const userId = user.user_id || user.id || '—';
            const createdAt = user.created_at || user.createdAt || null;

            // Avatar
            avatarInitials.textContent = getInitials(name);

            // Header
            profileName.textContent = name;
            profileEmail.textContent = email;
            profileRole.innerHTML = `<i class="fas fa-user-check"></i> ${role.charAt(0).toUpperCase() + role.slice(1)}`;

            // Details
            detailName.textContent = name;
            detailEmail.textContent = email;
            detailRole.textContent = role.charAt(0).toUpperCase() + role.slice(1);
            detailMemberSince.textContent = formatDate(createdAt);
            detailUserId.textContent = userId;
        }

        // ========================================
        // LOAD STATS — FROM DASHBOARD API
        // ========================================
        async function loadStats() {
            try {
                const response = await getDashboardStats();
                const stats = response.data || response;

                // Update stats
                statCourses.textContent = stats.courses || 0;
                statTopics.textContent = stats.topics || 0;
                statLessons.textContent = stats.lessons || 0;
                statFeedbacks.textContent = stats.feedback || 0;

            } catch (error) {
                console.warn('Failed to load stats from dashboard:', error);
                // Show placeholder dashes
                statCourses.textContent = '—';
                statTopics.textContent = '—';
                statLessons.textContent = '—';
                statFeedbacks.textContent = '—';
                showToast('warning', 'Stats Unavailable', 'Could not load platform statistics');
            }
        }

        // ========================================
        // LOAD PROFILE
        // ========================================
        async function loadProfile() {
            if (!isLoggedIn()) {
                showToast('warning', 'Authentication Required', 'Please login to continue');
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 1200);
                return;
            }

            // Load stats first (they're faster)
            await loadStats();

            try {
                const response = await profile();

                if (response && response.success && response.data) {
                    renderProfile(response.data);
                } else {
                    // Fallback to stored user
                    const storedUser = getUser();
                    if (storedUser) {
                        renderProfile(storedUser);
                    } else {
                        throw new Error('No profile data available');
                    }
                }
            } catch (error) {
                console.warn('Profile API error:', error);
                const storedUser = getUser();
                if (storedUser) {
                    renderProfile(storedUser);
                    showToast('info', 'Offline Mode', 'Showing cached profile data');
                } else {
                    showToast('error', 'Error', 'Failed to load profile');
                }
            }
        }

        // ========================================
        // LOGOUT
        // ========================================
        logoutBtn.addEventListener('click', function(e) {
            e.preventDefault();

            if (confirm('Are you sure you want to logout?')) {
                logout();
                showToast('success', 'Logged Out', 'You have been logged out successfully');
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 800);
            }
        });

        // ========================================
        // INIT
        // ========================================
        document.addEventListener('DOMContentLoaded', loadProfile);
    </script>

</body>
</html>
