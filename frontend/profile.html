<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="EZLearn — Your Profile" />
  <meta name="theme-color" content="#0A0E1A" />

  <title>EZLearn — Profile</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <!-- Auth Styles (Shared) -->
  <link rel="stylesheet" href="css/auth.css" />

  <style>
    /* ======================================== */
    /* PROFILE PAGE — Additional Styles        */
    /* ======================================== */

    /* ===== Profile Container ===== */
    .profile-container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 600px;
      padding: 20px;
      animation: authFadeUp 0.8s var(--ease-out) forwards;
      opacity: 0;
      transform: translateY(20px);
      margin: 0 auto;
    }

    /* ===== Profile Card ===== */
    .profile-card {
      padding: 40px 32px;
      background: var(--color-surface);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      box-shadow: 0 8px 64px rgba(0, 0, 0, 0.4);
      transition: all var(--duration-base) var(--ease-out);
    }

    .profile-card:hover {
      border-color: rgba(255, 255, 255, 0.12);
    }

    /* ===== Profile Header ===== */
    .profile-header {
      text-align: center;
      margin-bottom: 32px;
    }

    /* ===== Avatar ===== */
    .profile-avatar {
      position: relative;
      width: 100px;
      height: 100px;
      border-radius: 50%;
      margin: 0 auto 16px;
      background: linear-gradient(135deg, var(--color-primary), var(--color-secondary));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      font-weight: 700;
      color: white;
      box-shadow: 0 0 60px var(--color-primary-glow);
      cursor: default;
      transition: all var(--duration-base) var(--ease-out);
      user-select: none;
    }

    .profile-avatar:hover {
      transform: scale(1.03);
      box-shadow: 0 0 80px var(--color-primary-glow);
    }

    /* ===== Profile Name ===== */
    .profile-name {
      font-family: var(--font-display);
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--color-text-primary);
    }

    .profile-email {
      font-size: 0.9375rem;
      color: var(--color-text-secondary);
    }

    /* ===== Profile Role Badge ===== */
    .profile-role {
      display: inline-block;
      padding: 4px 16px;
      border-radius: var(--radius-full);
      background: var(--color-primary-soft);
      color: var(--color-primary);
      font-size: 0.75rem;
      font-weight: 500;
      margin-top: 8px;
      border: 1px solid var(--color-border);
    }

    /* ===== Profile Form ===== */
    .profile-form {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 24px;
    }

    .profile-form__group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .profile-form__label {
      font-size: 0.8125rem;
      font-weight: 500;
      color: var(--color-text-secondary);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .profile-form__label i {
      font-size: 0.75rem;
      color: var(--color-text-muted);
    }

    .profile-form__input {
      padding: 12px 16px;
      background: var(--color-bg-secondary);
      border: 2px solid var(--color-border);
      border-radius: var(--radius-sm);
      color: var(--color-text-primary);
      font-family: var(--font-display);
      font-size: 0.9375rem;
      transition: all var(--duration-fast) var(--ease-out);
      outline: none;
    }

    .profile-form__input:focus {
      border-color: var(--color-primary);
      box-shadow: 0 0 0 4px var(--color-primary-glow);
    }

    .profile-form__input:disabled,
    .profile-form__input[readonly] {
      opacity: 0.7;
      cursor: default;
      background: var(--color-bg-secondary);
    }

    .profile-form__input[readonly]:focus {
      border-color: var(--color-border);
      box-shadow: none;
    }

    /* ===== Profile Buttons ===== */
    .profile-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 8px;
    }

    .profile-actions .auth-btn {
      flex: 1;
      min-width: 120px;
    }

    .auth-btn--secondary {
      background: var(--color-bg-secondary);
      color: var(--color-text-secondary);
      border: 1px solid var(--color-border);
    }

    .auth-btn--secondary:hover {
      background: var(--color-surface-hover);
      border-color: var(--color-border-focus);
      color: var(--color-text-primary);
      transform: translateY(-2px);
    }

    .auth-btn--danger {
      background: transparent;
      color: #EF4444;
      border: 1px solid rgba(239, 68, 68, 0.2);
    }

    .auth-btn--danger:hover {
      background: rgba(239, 68, 68, 0.1);
      border-color: rgba(239, 68, 68, 0.3);
      color: #F87171;
      transform: translateY(-2px);
    }

    .auth-btn--danger i {
      font-size: 0.875rem;
    }

    /* ===== Divider ===== */
    .profile-divider {
      display: flex;
      align-items: center;
      gap: 16px;
      margin: 24px 0;
    }

    .profile-divider::before,
    .profile-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--color-border);
    }

    .profile-divider span {
      font-size: 0.75rem;
      color: var(--color-text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      white-space: nowrap;
    }

    /* ======================================== */
    /* TOAST OVERRIDES (for profile)           */
    /* ======================================== */
    .toast-container {
      top: 80px;
    }

    /* ======================================== */
    /* RESPONSIVE                              */
    /* ======================================== */

    @media (max-width: 600px) {
      .profile-container {
        padding: 12px;
      }

      .profile-card {
        padding: 24px 20px;
      }

      .profile-avatar {
        width: 80px;
        height: 80px;
        font-size: 2rem;
      }

      .profile-name {
        font-size: 1.25rem;
      }

      .profile-actions {
        flex-direction: column;
      }

      .profile-actions .auth-btn {
        min-width: auto;
      }

      .profile-form__input {
        padding: 10px 14px;
        font-size: 0.875rem;
      }
    }

    @media (min-width: 601px) and (max-width: 1024px) {
      .profile-container {
        max-width: 520px;
      }

      .profile-avatar {
        width: 90px;
        height: 90px;
        font-size: 2.25rem;
      }
    }

    /* hide update button until backend update exists */
    #updateProfileBtn {
      display: none;
    }
  </style>
</head>
<body class="auth-body">

  <!-- ===== BACKGROUND ORBS ===== -->
  <div class="auth-bg-orb auth-bg-orb--1"></div>
  <div class="auth-bg-orb auth-bg-orb--2"></div>
  <div class="auth-bg-orb auth-bg-orb--3"></div>

  <!-- ===== TOAST CONTAINER ===== -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- ===== PROFILE CONTAINER ===== -->
  <div class="profile-container">
    <div class="profile-card">

      <!-- ===== Profile Header ===== -->
      <div class="profile-header">
        <!-- Avatar -->
        <div class="profile-avatar" id="avatarDisplay">
          <span id="avatarInitials">JD</span>
        </div>

        <!-- Name -->
        <h1 class="profile-name" id="profileName">John Doe</h1>
        <p class="profile-email" id="profileEmail">john.doe@example.com</p>
        <span class="profile-role" id="profileRole">
          <i class="fas fa-user-check"></i> User
        </span>
      </div>

      <!-- ===== Profile Form (READ-ONLY) ===== -->
      <form class="profile-form" id="profileForm">

        <div class="profile-form__group">
          <label for="fullName" class="profile-form__label">
            <i class="fas fa-user"></i> Full Name
          </label>
          <input type="text" id="fullName" class="profile-form__input" readonly />
        </div>

        <div class="profile-form__group">
          <label for="email" class="profile-form__label">
            <i class="fas fa-envelope"></i> Email Address
          </label>
          <input type="email" id="email" class="profile-form__input" readonly />
        </div>

        <div class="profile-form__group">
          <label for="memberSince" class="profile-form__label">
            <i class="fas fa-calendar-alt"></i> Member Since
          </label>
          <input type="text" id="memberSince" class="profile-form__input" disabled />
        </div>

        <!-- ===== Action Buttons ===== -->
        <div class="profile-actions">
          <button type="submit" class="auth-btn auth-btn--primary" id="updateProfileBtn" style="display:none;">
            <i class="fas fa-save"></i> Update Profile
          </button>
        </div>

      </form>

      <!-- ===== Divider ===== -->
      <div class="profile-divider">
        <span>Account</span>
      </div>

      <!-- ===== Logout ===== -->
      <button class="auth-btn auth-btn--danger auth-btn--full" id="logoutBtn">
        <i class="fas fa-sign-out-alt"></i> Logout
      </button>

    </div>
  </div>

  <!-- ======================================== -->
  <!-- SCRIPTS (ES Modules)                     -->
  <!-- ======================================== -->
  <script type="module">
    // ------------------------------------------------
    // 1. Imports – reuse existing services
    // ------------------------------------------------
    import { isLoggedIn, logout, getUser, saveUser } from '../utils/auth.js';
    import { profile } from '../services/authService.js';
    import { showToast } from '../components/toast.js'; // assuming toast component exists

    // ------------------------------------------------
    // 2. DOM refs
    // ------------------------------------------------
    const avatarInitials = document.getElementById('avatarInitials');
    const profileName = document.getElementById('profileName');
    const profileEmail = document.getElementById('profileEmail');
    const profileRole = document.getElementById('profileRole');
    const fullNameInput = document.getElementById('fullName');
    const emailInput = document.getElementById('email');
    const memberSinceInput = document.getElementById('memberSince');
    const logoutBtn = document.getElementById('logoutBtn');

    // ------------------------------------------------
    // 3. Helper – generate initials
    // ------------------------------------------------
    function getInitials(name) {
      if (!name) return '??';
      const parts = name.trim().split(/\s+/);
      if (parts.length === 0) return '??';
      if (parts.length === 1) return parts[0].substring(0, 2).toUpperCase();
      return (parts[0][0] + parts[1][0]).toUpperCase();
    }

    // ------------------------------------------------
    // 4. Format date -> "Month Day, Year"
    // ------------------------------------------------
    function formatMemberSince(dateString) {
      if (!dateString) return '—';
      const d = new Date(dateString);
      if (isNaN(d.getTime())) return '—';
      return d.toLocaleDateString('en-US', {
        month: 'long',
        day: 'numeric',
        year: 'numeric'
      });
    }

    // ------------------------------------------------
    // 5. Render profile data
    // ------------------------------------------------
    function renderProfile(user) {
      if (!user) return;

      const name = user.name || 'User';
      const email = user.email || '—';
      const role = user.role || 'user';
      const createdAt = user.created_at || null;

      // Avatar initials
      avatarInitials.textContent = getInitials(name);

      // Header
      profileName.textContent = name;
      profileEmail.textContent = email;
      profileRole.innerHTML = `<i class="fas fa-user-check"></i> ${role.charAt(0).toUpperCase() + role.slice(1)}`;

      // Form fields (readonly)
      fullNameInput.value = name;
      emailInput.value = email;
      memberSinceInput.value = createdAt ? formatMemberSince(createdAt) : '—';
    }

    // ------------------------------------------------
    // 6. Handle API error → logout + redirect
    // ------------------------------------------------
    function handleApiError(error) {
      console.warn('Profile API error:', error);

      // if it's a 401/403/404 or any other, logout and redirect
      logout(); // reuses existing logout from auth.js
      showToast('error', 'Session Expired', 'Please login again.');
      setTimeout(() => {
        window.location.href = 'login.html';
      }, 1200);
    }

    // ------------------------------------------------
    // 7. Main: load profile
    // ------------------------------------------------
    async function loadProfile() {
      // 7a. Check authentication
      if (!isLoggedIn()) {
        window.location.href = 'login.html';
        return;
      }

      try {
        // 7b. Call real backend via authService.profile()
        const response = await profile();

        // response structure: { success: true, data: { user_id, name, email, role, created_at } }
        if (response && response.success && response.data) {
          const user = response.data;

          // update session storage (optional but keeps sync)
          saveUser(user);

          // render UI
          renderProfile(user);
        } else {
          // unexpected response format → treat as error
          throw new Error('Invalid profile response');
        }
      } catch (error) {
        // Any network error, 401, 403, 404, etc.
        handleApiError(error);
      }
    }

    // ------------------------------------------------
    // 8. Logout handler – reuse logout() from auth.js
    // ------------------------------------------------
    logoutBtn.addEventListener('click', function(e) {
      e.preventDefault();

      // reuse the existing logout utility
      logout();

      // show toast and redirect
      showToast('success', 'Logged Out', 'You have been logged out.');
      setTimeout(() => {
        window.location.href = 'login.html';
      }, 1000);
    });

    // ------------------------------------------------
    // 9. Go!
    // ------------------------------------------------
    document.addEventListener('DOMContentLoaded', loadProfile);

    // Make showToast available globally for inline use (toast container)
    window.showToast = showToast;
  </script>

</body>
</html>
